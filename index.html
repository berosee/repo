<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>repo</title>
<link rel="stylesheet" href="style.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<div class="menu">
<button id="old" onclick="loadCategory('old')">OLD</button>
<button id="enka" onclick="loadCategory('enka')">ENKA</button>
<button id="jazz" onclick="loadCategory('jazz')">JAZZ</button>
</div>

<audio id="player" controls></audio>

<div class="controls">
<button onclick="prevSong()">◀ 이전</button>
<button onclick="nextSong()">다음 ▶</button>
<button onclick="randomSong()">랜덤</button>
</div>

<div id="playlist"></div>

<script src="player.js"></script>
<script>
// 화면 시작 시 'old' 리스트를 불러오고 버튼을 활성화합니다.
window.onload = function() {
    loadCategory('old');
};
</script>

</body>
</html>
